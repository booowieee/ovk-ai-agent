version: '3.8'

services:
  app:
    build: .
    container_name: ovk_ai_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  db:
    image: postgres:16-alpine
    container_name: ovk_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ovk_agent
      POSTGRES_PASSWORD: ovk_agent_pass
      POSTGRES_DB: ovk_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovk_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ovk_ai_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
